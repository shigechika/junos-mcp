site_name: junos-mcp
site_description: >-
  MCP server for junos-ops — show commands, config diffs and pushes, firmware
  upgrades, RSI/SCF diagnostics, and a daily_brief health check across a
  fleet of Juniper JUNOS devices, with dry-run-by-default write tools.
site_url: https://shigechika.github.io/junos-mcp/
repo_url: https://github.com/shigechika/junos-mcp
repo_name: shigechika/junos-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true

nav:
  - Home: index.md
  - Setup: setup.md
  - Reference: reference.md
